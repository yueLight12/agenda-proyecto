<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2438" />
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem("tema");
          var prefiereOscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", guardado || (prefiereOscuro ? "oscuro" : "claro"));
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "claro");
        }
      })();
    </script>
    <!-- Panel "Personalizar apariencia" (2026-08-26) -- mismo truco que el
         script de arriba para --radius-shape: aplica el último valor
         conocido (mirror en localStorage) antes del primer paint, para no
         "flashear" el default mientras el GET a /usuarios/me/preferencias
         responde. Ver usePreferenciasApariencia.js. -->
    <script>
      (function () {
        var radios = { square: "4px", rounded: "12px", circle: "999px" };
        try {
          var forma = localStorage.getItem("apariencia_shape");
          document.documentElement.style.setProperty("--radius-shape", radios[forma] || radios.rounded);
        } catch (e) {
          document.documentElement.style.setProperty("--radius-shape", radios.rounded);
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda Inteligente" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Agenda Inteligente de Proyectos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
