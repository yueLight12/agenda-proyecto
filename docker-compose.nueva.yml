name: agenda-nueva

# Self-contained: no depende de contenedores de otro proyecto (agenda-proyecto).
# Puertos y nombre de base de datos elegidos a propósito distintos a los de
# agenda-proyecto (5442/8012/8010/5183) para que ambos stacks puedan convivir
# en la misma máquina sin chocar, aunque en la máquina de un desarrollador
# nuevo normalmente solo este stack va a existir.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agenda_nueva
    ports:
      - "5452:5432"
    volumes:
      - agenda_nueva_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
    volumes:
      - agenda_nueva_whisper_models:/root/.cache/whisper
    ports:
      - "8013:9000"

  api:
    build: ./agenda-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./agenda-backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/agenda_nueva
      SECRET_KEY: dev-secret-key-cambiar-en-produccion
      WHISPER_URL: http://whisper:9000
    ports:
      - "8011:8000"
    volumes:
      - ./agenda-backend:/code

  web:
    build:
      context: ./agenda-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8011}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5184:5173"

volumes:
  agenda_nueva_db_data:
  agenda_nueva_whisper_models:
